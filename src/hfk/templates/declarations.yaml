# This file was written by `hfk init` with example data.
# Alex and Sam are placeholders: replace them with your own people, accounts,
# buckets, and amounts before trusting any report.
# Validate with: hfk plan check --home <dir> and hfk doctor --home <dir>.
schema_version: 1
buckets:
  - {name: Fixed Essential, essential: true, fixed: true}
  - {name: Variable Essential, essential: true, fixed: false}
  - {name: Fixed Discretionary, essential: false, fixed: true}
  - {name: Variable Discretionary, essential: false, fixed: false}
mapping_source: tiller_group
groups:
  Housing: Fixed Essential
  Food: Variable Essential
  Transportation: Variable Essential
  Subscriptions: Fixed Discretionary
non_spend_groups: [Income, Transfers]
overrides:
  "Utilities": {bucket: Variable Essential, reason: "Utilities vary by season; the rest of Housing is fixed."}
  "Dining": {bucket: Variable Discretionary, reason: "Eating out is optional; the rest of Food is essential."}
splits:
  "Fuel":
    weights: {Variable Essential: 0.5, Variable Discretionary: 0.5}
    reason: "Commuting fuel is essential and trip fuel is optional."
sharing:
  - match: {account: "Alex Checking", description: "City Utilities*"}
    weights: {alex: 0.5, sam: 0.5}
    reason: "Utilities are a joint bill paid from Alex's account."
closed_accounts: {}
