# This file was written by `hfk init` with example data.
# Alex and Sam are placeholders: replace them with your own people, accounts,
# buckets, and amounts before trusting any report.
# Validate with: hfk plan check --home <dir> and hfk doctor --home <dir>.
schema_version: 1
people:
  - {slug: alex, name: Alex}
  - {slug: sam, name: Sam}
files:
  tiller_glob: "Tiller*.xls*"
history_start: 2025-01-01
accounts:
  "Alex Checking": {owner: alex}
  "Sam Checking": {owner: sam}
  "Joint Card": {shared: {alex: 0.5, sam: 0.5}}
  "Savings": {owner: alex, kind: savings}
# extensions: opt-in add-ons, enabled by name. settle_up ships with hfk;
# retirement is planned (M8). An enabled extension that is not installed is an error.
extensions: [settle_up]
