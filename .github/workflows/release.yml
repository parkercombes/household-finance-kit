name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip wheel --no-deps -w dist .
      - name: Verify the tag matches the wheel version
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, re, sys, os
          wheels = glob.glob("dist/hfk-*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected one wheel, found {wheels}")
          version = re.match(r"hfk-(.+)-py3-none-any\.whl", wheels[0].split("/")[-1]).group(1)
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version != tag:
              sys.exit(f"tag {tag} does not match wheel version {version}")
          print(f"wheel version {version} matches tag {tag}")
          PY
      - run: python scripts/build_installers.py --wheel dist/hfk-*.whl --out dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.zip \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "household-finance-kit $GITHUB_REF_NAME"
