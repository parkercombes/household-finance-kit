[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "household-finance-kit"
version = "0.1.0.dev0"
description = "Read-only household budgeting analysis for Tiller workbooks."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "openpyxl",
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "ruff==0.16.10",
]

[project.scripts]
hfk = "hfk.cli:main"

# Built-in-first extensions: shipped in this distribution, still discovered
# through entry points so core never imports them (ADR-0006).
[project.entry-points."hfk.extensions"]
settle_up = "hfk.ext.settle_up:SettleUp"
retirement = "hfk.ext.retirement:Retirement"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hfk.profiles" = ["*.yaml"]
"hfk.ext.retirement" = ["tax_data/*.yaml", "tax_data/*.md"]
"hfk.templates" = ["*.yaml", "*.md", "*.json", "gitignore", "pre-commit", "tiller_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
